name: pawprint
description: Field registry for community dogs — name, breed, ID, health, photo, and location.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  image_picker: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.5.1
  supabase_flutter: ^2.17.2
  url_launcher: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - logo.png
    - signin.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "web/favicon.png"
  remove_alpha_ios: true
